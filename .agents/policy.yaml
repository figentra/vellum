# Vellum Approval Policy

# Risk classes and approval requirements
risk_classes:
  low:
    description: "Minor changes, no public API impact"
    approvers: 1
    requires: [author]

  medium:
    description: "Feature changes, public API additions"
    approvers: 1
    requires: [author, reviewer]

  high:
    description: "Breaking changes, security-sensitive code"
    approvers: 2
    requires: [author, two-reviewers]

  critical:
    description: "Approval process changes, security gates"
    approvers: 2
    requires: [author, two-reviewers, security-review]

# Model tiers (no direct model names, only tiers)
model_tiers:
  draft: "For drafting and ideation"
  verify: "For verification and testing"
  implement: "For implementation work"
  review: "For code review"

# Egress control
egress:
  allow_network: false
  allow_filesystem_write: false
  allow_child_process: false
