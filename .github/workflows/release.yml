name: Release

# A human pushes a vX.Y.Z tag; this job publishes @figentra/vellum at that
# version to the private Figentra registry (https://npm.figentra.com/, an
# npflared registry). Nothing is published to the public npm registry:
# packages/vellum/package.json pins publishConfig.registry, and a bundle test
# fails if it changes.
#
# The registry token is never stored in GitHub. The job authenticates to
# Infisical with GitHub OIDC and reads NPFLARED_AUTH_TOKEN from the /ci path.
# A human sets up, once:
#   - an Infisical machine identity with GitHub OIDC auth bound to this
#     repository and to tag refs, allowed to read /ci in the prod environment;
#   - NPFLARED_AUTH_TOKEN in /ci (a npflared token that may publish @figentra/vellum);
#   - repository variables (not secrets) INFISICAL_IDENTITY_ID and INFISICAL_PROJECT_SLUG.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # the GitHub release
  id-token: write # the OIDC token Infisical verifies

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @figentra/vellum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Take the version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Set before the build: the bundle embeds this version in
      # `vellum --version`, the MCP serverInfo and every Evidence Entry.
      - name: Stamp the version into packages/vellum
        run: npm pkg set version="${{ steps.version.outputs.version }}" --prefix packages/vellum

      - run: pnpm install --frozen-lockfile

      # The same gate CI runs, including the pack -> offline install -> run test.
      - name: Build, typecheck, lint and test
        run: pnpm turbo run build typecheck lint test --force

      - name: Fetch the registry token from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: "prod"
          secret-path: "/ci"

      - name: Publish to npm.figentra.com
        working-directory: packages/vellum
        run: |
          # The .npmrc names the variable, never the value; npm expands it.
          echo '//npm.figentra.com/:_authToken=${NPFLARED_AUTH_TOKEN}' > .npmrc
          npm publish
          rm -f .npmrc

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Vellum $GITHUB_REF_NAME" \
            --notes "Install: add \`@figentra:registry=https://npm.figentra.com/\` to your .npmrc, then \`npm install @figentra/vellum@${{ steps.version.outputs.version }}\`."
