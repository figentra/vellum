name: CI

# No job in this workflow reads a secret: nothing here needs a token, a
# registry credential or a signing key. The end-to-end suite generates its
# own throwaway SSH signing keys inside a temp directory per run. Publishing
# lives only in release.yml, behind a human-pushed tag and OIDC.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes the running check; pushes to
  # main each run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, typecheck, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor (package.json) and mise's pin; 24 is current.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The storage signature tests and the e2e suite shell out to these;
      # ubuntu-latest ships all of them. Printed so a failure names the version.
      - name: Tools the tests shell out to
        run: |
          git --version
          ssh -V
          gpg --version | head -n 1
          script --version
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One command, the same one release.yml gates on:
      #   build     every package, the @figentra/vellum bundle and the three plugins
      #   typecheck every TypeScript member
      #   lint      oxlint per member; its turbo task depends on
      #             //#check:boundaries (scripts/check-boundaries.mjs)
      #   test      every unit and integration suite, @figentra/vellum's
      #             npm pack -> offline install test and its size budget, the
      #             CLI/MCP parity suite, and @vellum/e2e: the packed tarball
      #             driven through the whole spec lifecycle in temp git
      #             repositories (packages/e2e/README.md). That suite replaces
      #             the placeholder "conformance" job this workflow had.
      - name: Build, typecheck, lint and test
        run: pnpm turbo run build typecheck lint test

  audit:
    name: Audit runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on any moderate-or-worse advisory in a production dependency.
      # @figentra/vellum bundles the workspace and has no runtime dependency,
      # so this passes today and fails the day one with an advisory is added.
      # Development tooling (vitest, stryker, tsup) is not gated here: it
      # carries open moderate advisories whose fixes need major upgrades,
      # tracked separately rather than hidden behind continue-on-error.
      - name: pnpm audit --prod
        run: pnpm audit --prod --audit-level=moderate
